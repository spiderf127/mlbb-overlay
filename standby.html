<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPL Standby</title>
<style>
@font-face {
  font-family: 'Eixample Villa';
  src: url('assets/font/Eixample Villa Bold.otf') format('opentype');
  font-weight: bold;
}

:root {
  --ink: #2F2F2F;
  --blue: #2962FF;
  --red: #D32F2F;
  --silver-gradient: linear-gradient(270deg, #F4F4F4, #FFFFFF, #EAEAEA, #F4F4F4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: var(--silver-gradient);
  background-size: 400% 400%;
  animation: movingGradient 6s ease infinite;
  color: var(--ink);
  font-family: 'Eixample Villa', sans-serif;
  user-select: none;
}

@keyframes movingGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.standby-layout {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 34% 66%;
}

.standby-info {
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 5vh 4vw;
  text-align: center;
  border-right: 1px solid rgba(47, 47, 47, 0.12);
}

.tournament-logo {
  width: min(10vw, 150px);
  height: min(10vw, 150px);
  object-fit: contain;
  margin-bottom: 3vh;
}

.tournament-name {
  max-width: 100%;
  font-size: clamp(18px, 2vw, 36px);
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 10vh;
}

.matchup {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 1.5vw, 28px);
}

.team {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.team-logo {
  width: clamp(42px, 5vw, 92px);
  height: clamp(42px, 5vw, 92px);
  object-fit: contain;
}

.team-name {
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: clamp(16px, 1.7vw, 32px);
  text-transform: uppercase;
  color: #2F2F2F;
}

.vs {
  flex: 0 0 auto;
  font-size: clamp(18px, 2vw, 38px);
  color: rgba(47, 47, 47, .55);
}

.team-score {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.score-pip {
  width: 24px;
  height: 8px;
  background: rgba(47, 47, 47, 0.2);
  border-radius: 0;
  transition: background 0.3s;
}

.team-blue .score-pip.filled {
  background: var(--blue);
}

.team-red .score-pip.filled {
  background: var(--red);
}

.stream-timer {
  margin-top: 14vh;
  font-size: clamp(54px, 7vw, 132px);
  line-height: .9;
  letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
}

.timer-label {
  margin-top: 12px;
  color: rgba(47, 47, 47, .65);
  font-size: clamp(20px, 1.8vw, 28px);
  letter-spacing: .18em;
  text-transform: uppercase;
}

@media (max-width: 700px) {
  .standby-layout { grid-template-columns: 34% 66%; }
  .standby-info { padding: 3vh 2vw; }
  .tournament-logo { margin-bottom: 2vh; }
  .tournament-name { margin-bottom: 3vh; }
  .matchup { gap: 2px; }
  .team { gap: 6px; }
  .stream-timer { margin-top: 4vh; }
}
</style>
</head>
<body>
<main class="standby-layout">
  <section class="standby-info" aria-label="Tournament standby information">
    <img id="tournamentLogo" class="tournament-logo" src="assets/imgs/tournamentlogo.png" alt="Tournament logo" onerror="this.style.visibility='hidden'">
    <div id="tournamentName" class="tournament-name">MPL Season 15</div>
    <div class="matchup">
      <div class="team team-blue">
        <img id="blueLogo" class="team-logo" src="" alt="Blue team logo" onerror="this.style.visibility='hidden'">
        <div id="blueName" class="team-name">TEAM BLUE</div>
        <div id="blueScore" class="team-score">0</div>
      </div>
      <div class="vs">VS</div>
      <div class="team team-red">
        <img id="redLogo" class="team-logo" src="" alt="Red team logo" onerror="this.style.visibility='hidden'">
        <div id="redName" class="team-name">TEAM RED</div>
        <div id="redScore" class="team-score">0</div>
      </div>
    </div>
    <div id="streamTimer" class="stream-timer">00:00</div>
    <div class="timer-label">Coming up</div>
  </section>
  <section aria-hidden="true"></section>
</main>

<script>
const SK = 'mplDraft_v4';
const BCAST = 'mplDraft_bc';
let state = null;
let lastStr = '';

function readState() {
  try {
    const raw = localStorage.getItem(SK);
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    return null;
  }
}

function formatTimer(seconds) {
  const total = Math.max(0, Math.floor(Number(seconds) || 0));
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
}

function render(nextState) {
  if (!nextState) return;
  const str = JSON.stringify(nextState);
  if (str === lastStr) return;
  lastStr = str;
  state = nextState;
  const meta = state.meta || {};
  const teams = state.teams || {};
  const blue = teams.blue || {};
  const red = teams.red || {};
  
  const bWins = Number(meta.blueWins) || 0;
  const rWins = Number(meta.redWins) || 0;
  const boFormat = meta.bo || 'BO3';
  const maxWins = { 'BO1': 1, 'BO3': 2, 'BO5': 3, 'BO7': 4 }[boFormat] || 2;
  
  document.getElementById('tournamentName').textContent = meta.tournament || 'MPL Season 15';
  document.getElementById('blueName').textContent = blue.tag || blue.name || 'TAG';
  document.getElementById('redName').textContent = red.tag || red.name || 'TAG';
  
  // Render score pips
  let bluePips = '';
  let redPips = '';
  for(let i=0; i<maxWins; i++) {
    bluePips += `<div class="score-pip ${i < bWins ? 'filled' : ''}"></div>`;
    redPips += `<div class="score-pip ${i < rWins ? 'filled' : ''}"></div>`;
  }
  document.getElementById('blueScore').innerHTML = bluePips;
  document.getElementById('redScore').innerHTML = redPips;
  
  updateLogo('blueLogo', blue.logo);
  updateLogo('redLogo', red.logo);
  document.getElementById('streamTimer').textContent = formatTimer(state.streamTimer?.remaining);
}

function updateLogo(id, source) {
  const image = document.getElementById(id);
  if (source) {
    image.src = source.includes("/") ? source : "assets/teams/" + source;
    image.style.visibility = 'visible';
  } else {
    image.removeAttribute('src');
    image.style.visibility = 'hidden';
  }
}

try {
  const bc = new BroadcastChannel(BCAST);
  bc.onmessage = event => {
    if (event.data?.t === 'STATE') render(event.data.d);
  };
} catch (error) {}

window.addEventListener('storage', e => {
  if(e.key === SK && e.newValue) {
    try { render(JSON.parse(e.newValue)); } catch(e){}
  }
});

setInterval(() => {
  fetch('sync.php')
    .then(r => r.json())
    .then(data => {
      if(data && !data.error) render(data);
    }).catch(()=>{
      render(readState());
    });
}, 300);

render(readState());
</script>
</body>
</html>
